<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/windows-95-desktop/My Computer.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#160f06" />
    <title>Yiming Su</title>
    <!-- First paint = the 3D scene's backdrop colour so there's no flash
         before the CSS bundle and the canvas arrive. -->
    <style>
      html, body { margin: 0; background: #160f06; }
      /* stacked layout (layoutKindFor in src/layout.ts): the panel sheet's
         colour, so the still-empty sheet doesn't show as a lighter block */
      @media (max-aspect-ratio: 11/10), (max-width: 599.98px) {
        html, body { background: #1e1a15; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
